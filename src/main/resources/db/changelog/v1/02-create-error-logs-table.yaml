databaseChangeLog:
  - changeSet:
      id: createErrorLogsTable
      author: anton_l
      changes:
        - createTable:
            tableName: error_logs
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
              - column:
                  name: incident_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_error_logs_incident
                    references: incidents(id)
                    deleteCascade: true
              - column:
                  name: environment
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: trace_id
                  type: varchar(64)
              - column:
                  name: occurred_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: error_logs
            indexName: idx_error_logs_incident_id
            columns:
              - column:
                  name: incident_id