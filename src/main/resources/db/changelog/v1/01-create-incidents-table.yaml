databaseChangeLog:
  - changeSet:
      id: createIncidentsTable
      author: anton_l
      changes:
        - createTable:
            tableName: incidents
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
              - column:
                  name: fingerprint
                  type: varchar(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: service_name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: exception_class
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: text
              - column:
                  name: sample_stacktrace
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: severity
                  type: varchar(20)
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: NEW
                  constraints:
                    nullable: false
              - column:
                  name: ai_root_cause
                  type: text
              - column:
                  name: ai_suggested_fix
                  type: text
              - column:
                  name: occurrences
                  type: bigint
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: first_seen_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_seen_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: incidents
            indexName: idx_incidents_status_last_seen
            columns:
              - column:
                  name: status
              - column:
                  name: last_seen_at